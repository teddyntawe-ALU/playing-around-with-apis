# HAProxy configuration for Lb01 (recommended — matches the existing load-balancer setup).
# Replace WEB01_IP and WEB02_IP with the servers' addresses, then:
#   sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak.$(date +%F-%H%M)
#   sudo cp deploy/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg
#   sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 2048
    user haproxy
    group haproxy
    daemon
    # HAProxy 2.x lowercases header names; keep the original spelling
    h1-case-adjust x-served-by X-Served-By

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor                 # adds X-Forwarded-For with the client IP
    option h1-case-adjust-bogus-client
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 2
    option redispatch                 # retry a failed request on the other server

frontend http_front
    bind *:80
    http-request set-header X-Forwarded-Proto http
    default_backend rxlens_servers

backend rxlens_servers
    balance roundrobin
    # Active health check: a server is removed after 3 failed checks, re-added after 2 good ones.
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 5s fall 3 rise 2
    server web-01 WEB01_IP:80 check
    server web-02 WEB02_IP:80 check

# Optional read-only stats page, reachable only from the load balancer itself:
#   curl http://127.0.0.1:8404/stats
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 5s
