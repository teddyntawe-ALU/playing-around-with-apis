# HAProxy configuration for Lb01 (tested syntax target: HAProxy 2.0, as installed on lb-01).
# It keeps the existing HTTPS setup (SSL termination + HTTP→HTTPS redirect) and adds active
# health checks against the app's /api/health endpoint.
#
# Replace WEB01_IP, WEB02_IP and the certificate path (CERT_PEM), then on Lb01:
#   sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak.$(date +%F-%H%M)
#   sudo cp haproxy.cfg /etc/haproxy/haproxy.cfg
#   sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# No HTTPS certificate yet? Delete the https_front block and the redirect line in http_front.

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 2048
    user haproxy
    group haproxy
    daemon
    tune.ssl.default-dh-param 2048
    # HAProxy 2.x lowercases header names; keep the original spelling
    h1-case-adjust x-served-by X-Served-By
    h1-case-adjust location Location

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor                 # adds X-Forwarded-For with the client IP
    option h1-case-adjust-bogus-client
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 2
    option redispatch                 # send retries to the other server
    # Also retry when a server answers 502/503/504 (e.g. its Nginx is up but the app crashed)
    # or drops the connection, so users don't see errors before the health check catches up.
    retry-on conn-failure empty-response response-timeout 502 503 504

frontend http_front
    bind *:80
    http-request redirect scheme https code 301 unless { ssl_fc }
    default_backend rxlens_servers

frontend https_front
    bind *:443 ssl crt CERT_PEM
    http-request set-header X-Forwarded-Proto https
    default_backend rxlens_servers

backend rxlens_servers
    balance roundrobin
    # Active health check every 2s: a server is removed after 2 failed checks (~4s),
    # re-added after 2 good ones.
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server web-01 WEB01_IP:80 check
    server web-02 WEB02_IP:80 check

# Optional read-only stats page, reachable only from the load balancer itself:
#   curl http://127.0.0.1:8404/stats
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 5s
