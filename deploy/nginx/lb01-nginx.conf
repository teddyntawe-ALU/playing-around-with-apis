# ALTERNATIVE Lb01 configuration using Nginx instead of HAProxy.
# Use this only if Lb01 runs Nginx. Open-source Nginx supports passive health checks
# (max_fails / fail_timeout) rather than active polling of /api/health.
# Replace WEB01_IP and WEB02_IP, then:
#   sudo cp deploy/nginx/lb01-nginx.conf /etc/nginx/sites-available/rxlens-lb
#   sudo ln -sf /etc/nginx/sites-available/rxlens-lb /etc/nginx/sites-enabled/rxlens-lb
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream rxlens_servers {
    # Round-robin is Nginx's default strategy.
    server WEB01_IP:80 max_fails=3 fail_timeout=15s;
    server WEB02_IP:80 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://rxlens_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If one server fails, transparently retry the request on the other.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;

        # Shows which backend address answered (useful for the demo).
        add_header X-Upstream $upstream_addr always;
    }
}
