# Nginx site for Web01 and Web02: reverse proxy from port 80 to the Node app on 127.0.0.1:3000.
# Install (after backing up the current default site — see README "Web01 deployment"):
#   sudo cp deploy/nginx/web-server.conf /etc/nginx/sites-available/rxlens
#   sudo ln -sf /etc/nginx/sites-available/rxlens /etc/nginx/sites-enabled/rxlens
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream rxlens_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Same header the earlier load-balancer task used; identifies which server answered.
    # The app sends its own X-Served-By, so hide it to avoid a duplicate header.
    proxy_hide_header X-Served-By;
    add_header X-Served-By $hostname always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://rxlens_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;   # the app gives up on openFDA after 8s
    }

    location = /api/health {
        proxy_pass http://rxlens_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;           # the load balancer polls this every few seconds
    }
}
